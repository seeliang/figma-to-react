# tools/ builds the generator; packages/ is what the design system ships.
# The npm scopes say the same thing — @figma-to-react/* against @ds/* — and the
# directories now match, so "package" keeps its distribution meaning.
packages:
  - 'tools/*'
  - 'packages/*'
  - 'examples'

onlyBuiltDependencies:
  - esbuild
